
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#100e15">
  <title>mbnnOS — mustbenotnull</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #100e15;
      --muted: #a69ab2;
      --accent: #b594f9;
      --error: #e39bb3;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
    }

    body { font-family: monospace; }

    #shell {
      position: fixed;
      inset: 0;
      background: var(--bg);
    }

    #site {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
      opacity: 0;
      transition: opacity 700ms ease;
    }

    #site.ready { opacity: 1; }

    #status {
      position: absolute;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-content: center;
      gap: 14px;
      background: var(--bg);
      color: var(--muted);
      text-align: center;
      font: 12px monospace;
      opacity: 1;
      visibility: visible;
      transition: opacity 700ms ease, visibility 700ms;
    }

    #status.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-mark {
      display: flex;
      justify-content: center;
      align-items: baseline;
      white-space: nowrap;
      font: 800 52px/1.2 monospace;
      letter-spacing: -5px;
    }

    .boot-word {
      display: inline-block;
      color: #fff;
      transform-origin: center;
      animation: mbnn-breathe 3s ease-in-out infinite;
    }

    .boot-cursor {
      display: inline-block;
      color: var(--accent);
      animation: cursor-blink 1s steps(1, end) infinite;
    }

    #message { color: var(--muted); font: 12px monospace; }
    #error { display: none; max-width: 340px; color: var(--error); font: 12px/1.6 monospace; }
    #error.visible { display: block; }
    #retry { display: none; margin: 0 auto; padding: 7px 16px; border: 1px solid #685173; border-radius: 6px; background: transparent; color: var(--accent); font: 12px monospace; cursor: pointer; }
    #retry.visible { display: block; }
    #retry:hover { background: #b594f91a; border-color: var(--accent); }

    @keyframes mbnn-breathe {
      0%, 100% { opacity: .76; transform: scale(1); text-shadow: 0 0 0 transparent; }
      50% { opacity: 1; transform: scale(1.035); text-shadow: 0 0 24px #b594f955; }
    }
    @keyframes cursor-blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .boot-word, .boot-cursor { animation: none; }
      #site, #status { transition: none; }
    }
  </style>
</head>
<body>
  <div id="shell">
    <iframe id="site" title="mbnnOS" referrerpolicy="no-referrer" allow="clipboard-read; clipboard-write; fullscreen"></iframe>
    <div id="status" role="status" aria-live="polite">
      <div class="boot-mark"><span class="boot-word">mbnn</span><span class="boot-cursor">_</span></div>
      <div id="message">Preparing workspace...</div>
      <div id="error">Endpoint temporarily unavailable.</div>
      <button id="retry" type="button">retry</button>
    </div>
  </div>
<script>
(() => {
  "use strict";
  const ENDPOINT_FILE = "./current.json";
  const BOOT_MS = 3000, POLL_MS = 60000, LOAD_TIMEOUT_MS = 30000;
  const frame = document.getElementById("site"), status = document.getElementById("status"), message = document.getElementById("message"), errorBox = document.getElementById("error"), retry = document.getElementById("retry");
  let currentURL = "", loading = false, loadTimer = null, requestId = 0, bootFinished = false;
  function normalizeEndpoint(value) {
    const url = new URL(value);
    if (url.protocol !== "https:" || url.hostname.toLowerCase() === "trycloudflare.com" || !url.hostname.toLowerCase().endsWith(".trycloudflare.com")) throw new Error("Invalid Quick Tunnel endpoint");
    url.pathname = "/"; url.search = ""; url.hash = ""; return url.toString();
  }
  async function readEndpoint() {
    const response = await fetch(ENDPOINT_FILE + "?t=" + Date.now(), {cache:"no-store", headers:{Accept:"application/json"}});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if (!data || typeof data.url !== "string") throw new Error("Missing endpoint URL");
    return normalizeEndpoint(data.url);
  }
  function showPreparing(){message.textContent="Preparing workspace...";errorBox.classList.remove("visible");retry.classList.remove("visible");status.classList.remove("hidden");}
  function showError(){message.textContent="Workspace unavailable.";errorBox.textContent="Could not connect to the current endpoint.";errorBox.classList.add("visible");retry.classList.add("visible");status.classList.remove("hidden");frame.classList.remove("ready");}
  function clearLoadTimer(){if(loadTimer!==null){clearTimeout(loadTimer);loadTimer=null;}}
  function setFrame(endpoint,force=false){if(!force&&endpoint===currentURL)return;currentURL=endpoint;loading=true;clearLoadTimer();showPreparing();frame.classList.remove("ready");frame.src=endpoint;loadTimer=setTimeout(()=>{if(loading){loading=false;showError();}},LOAD_TIMEOUT_MS);}
  async function refreshEndpoint(force=false){const id=++requestId;try{const endpoint=await readEndpoint();if(id!==requestId)return;setFrame(endpoint,force);}catch(err){console.error("[mbnnOS locator]",err);if(id!==requestId)return;if(!frame.classList.contains("ready"))showError();}}
  frame.addEventListener("load",()=>{if(!currentURL||!loading)return;loading=false;clearLoadTimer();frame.classList.add("ready");status.classList.add("hidden");});
  retry.addEventListener("click",()=>{showPreparing();if(bootFinished)refreshEndpoint(true);});
  setTimeout(()=>{bootFinished=true;refreshEndpoint();},BOOT_MS);
  const pollTimer=setInterval(()=>{if(bootFinished)refreshEndpoint();},POLL_MS);
  window.addEventListener("beforeunload",()=>{clearLoadTimer();clearInterval(pollTimer);});
})();
</script>
</body>
</html>
