
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#100e15">
  <title>mbnnOS — mustbenotnull</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #100e15;
      --muted: #a69ab2;
      --accent: #b594f9;
      --error: #e39bb3;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
    }

    body {
      font-family: monospace;
    }

    #shell {
      position: fixed;
      inset: 0;
      background: var(--bg);
    }

    #site {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg);
      opacity: 0;
      transition: opacity .16s ease;
    }

    #site.ready {
      opacity: 1;
    }

    /* Matches the mbnnOS startup screen */
    #status {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-content: center;
      gap: 14px;
      padding: 24px;
      text-align: center;
      background: var(--bg);
      color: var(--muted);
      font: 12px monospace;
    }

    #status.hidden {
      display: none;
    }

    .boot-mark {
      color: white;
      font-size: 52px;
      font-weight: 800;
      letter-spacing: -5px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .boot-mark span {
      color: var(--accent);
      animation: blink 1s steps(1, end) infinite;
    }

    #message {
      font: 12px monospace;
      color: var(--muted);
    }

    #error {
      display: none;
      max-width: 340px;
      color: var(--error);
      font: 12px/1.6 monospace;
    }

    #error.visible {
      display: block;
    }

    #retry {
      display: none;
      margin: 0 auto;
      padding: 7px 16px;
      color: var(--accent);
      background: transparent;
      border: 1px solid #685173;
      border-radius: 6px;
      font: 12px monospace;
      cursor: pointer;
    }

    #retry.visible {
      display: block;
    }

    #retry:hover {
      background: #b594f91a;
      border-color: var(--accent);
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .boot-mark span { animation: none; }
      #site { transition: none; }
    }
  </style>
</head>

<body>
  <div id="shell">
    <iframe
      id="site"
      title="mbnnOS"
      referrerpolicy="no-referrer"
      allow="clipboard-read; clipboard-write; fullscreen"
    ></iframe>

    <div id="status" role="status" aria-live="polite">
      <div class="boot-mark">mbnn<span>_</span></div>
      <div id="message">Preparing workspace...</div>
      <div id="error">Endpoint temporarily unavailable.</div>
      <button id="retry" type="button">retry</button>
    </div>
  </div>

  <script>
    (() => {
      "use strict";

      const ENDPOINT_FILE = "./current.json";
      const POLL_MS = 60000;
      const LOAD_TIMEOUT_MS = 30000;

      const frame = document.getElementById("site");
      const status = document.getElementById("status");
      const message = document.getElementById("message");
      const errorBox = document.getElementById("error");
      const retry = document.getElementById("retry");

      let currentURL = "";
      let loadTimer = null;
      let requestId = 0;

      function normalizeEndpoint(value) {
        const url = new URL(value);

        if (url.protocol !== "https:") {
          throw new Error("HTTPS endpoint required");
        }

        const host = url.hostname.toLowerCase();

        if (
          host === "trycloudflare.com" ||
          !host.endsWith(".trycloudflare.com")
        ) {
          throw new Error("Unexpected endpoint host");
        }

        url.pathname = "/";
        url.search = "";
        url.hash = "";

        return url.toString();
      }

      async function readEndpoint() {
        const response = await fetch(
          ENDPOINT_FILE + "?t=" + Date.now(),
          {
            cache: "no-store",
            headers: {
              Accept: "application/json"
            }
          }
        );

        if (!response.ok) {
          throw new Error(
            "Endpoint lookup failed: HTTP " + response.status
          );
        }

        const data = await response.json();

        if (!data || typeof data.url !== "string") {
          throw new Error("Missing endpoint URL");
        }

        return normalizeEndpoint(data.url);
      }

      function showPreparing() {
        message.textContent = "Preparing workspace...";
        errorBox.classList.remove("visible");
        retry.classList.remove("visible");
        status.classList.remove("hidden");
      }

      function showError() {
        message.textContent = "Workspace unavailable.";
        errorBox.textContent =
          "Could not connect to the current endpoint.";
        errorBox.classList.add("visible");
        retry.classList.add("visible");
        status.classList.remove("hidden");
        frame.classList.remove("ready");
      }

      function clearLoadTimeout() {
        if (loadTimer !== null) {
          clearTimeout(loadTimer);
          loadTimer = null;
        }
      }

      function setFrame(endpoint, force = false) {
        if (!force && endpoint === currentURL) return;

        currentURL = endpoint;
        clearLoadTimeout();
        showPreparing();

        frame.classList.remove("ready");
        frame.src = endpoint;

        loadTimer = setTimeout(() => {
          loadTimer = null;
          if (!frame.classList.contains("ready")) {
            showError();
          }
        }, LOAD_TIMEOUT_MS);
      }

      async function refreshEndpoint(force = false) {
        const id = ++requestId;

        try {
          const endpoint = await readEndpoint();

          if (id !== requestId) return;

          setFrame(endpoint, force);
        } catch (err) {
          console.error("[mbnnOS locator]", err);

          if (id !== requestId) return;

          // Keep an already visible workspace alive
          // if a background endpoint lookup fails.
          if (!frame.classList.contains("ready")) {
            showError();
          }
        }
      }

      frame.addEventListener("load", () => {
        if (!currentURL) return;

        clearLoadTimeout();

        frame.classList.add("ready");
        status.classList.add("hidden");
      });

      retry.addEventListener("click", () => {
        showPreparing();
        refreshEndpoint(true);
      });

      // Start the connection.
      refreshEndpoint();

      // Detect Quick Tunnel URL changes without
      // reloading an unchanged endpoint.
      const pollTimer = setInterval(() => {
        refreshEndpoint();
      }, POLL_MS);

      window.addEventListener("beforeunload", () => {
        clearLoadTimeout();
        clearInterval(pollTimer);
      });
    })();
  </script>
</body>
</html>
